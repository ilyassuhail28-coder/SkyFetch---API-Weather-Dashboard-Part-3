<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyFetch Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <h1 class="app-title">🌤 SkyFetch Weather Dashboard</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter city name..." />
      <button id="searchBtn">Search</button>
    </div>

    <div id="weatherContainer" class="weather-container">
      <!-- Weather content will appear here -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
